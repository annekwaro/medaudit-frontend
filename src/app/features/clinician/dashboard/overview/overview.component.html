<header class="overview__header">
  <h1 class="overview__title">Dashboard</h1>

  <div class="time-anchor">
    <span id="date-range-label" class="time-anchor__text">Showing</span>
    <mat-form-field appearance="outline" subscriptSizing="dynamic" class="time-anchor__select">
      <mat-select aria-labelledby="date-range-label" [value]="dateRange()" (selectionChange)="dateRange.set($event.value)">
        @for (option of dateRangeOptions; track option.value) {
          <mat-option [value]="option.value">{{ option.label }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <span class="time-anchor__divider" aria-hidden="true"></span>

    <span class="time-anchor__text">
      Updated <time [attr.datetime]="updatedAt().toISOString()">{{ updatedAt() | date: 'HH:mm' }}</time>
    </span>
    <button mat-icon-button type="button" class="time-anchor__refresh" aria-label="Refresh" (click)="refresh()">
      <mat-icon
        [class.time-anchor__refresh-icon--spinning]="refreshing()"
        (animationend)="refreshing.set(false)"
      >refresh</mat-icon>
    </button>
  </div>
</header>

<app-visit-banner class="overview__banner" [summary]="sinceLastVisit" />

<section class="stats-grid" aria-label="Summary statistics">
  @for (stat of stats(); track stat.label) {
    <app-stats-card
      [label]="stat.label"
      [value]="stat.value"
      [delta]="stat.delta"
      [severity]="stat.severity"
      [icon]="stat.icon"
      [higherIsBetter]="stat.higherIsBetter"
      [pulse]="stat.pulse ?? false"
      link="/clinician/patients"
      [queryParams]="stat.filter ? { filter: stat.filter } : undefined"
      [linkLabel]="stat.linkLabel"
      [valueUnit]="stat.valueUnit"
    />
  }
</section>

<app-trend-chart
  class="trend-chart rise-in"
  [style.--rise-index]="stats().length"
  heading="Submissions this week"
  [points]="submissionsTrend()"
/>

<app-patient-list-table
  class="patient-list rise-in"
  [style.--rise-index]="stats().length + 1"
  heading="Recent Submissions"
  viewAllLink="/clinician/patients"
  [patients]="patients()"
  [staggerRows]="true"
/>
