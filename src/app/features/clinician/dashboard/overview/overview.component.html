<header class="overview__header">
  <div>
    <h1 class="overview__title">Welcome back, Dr. Martin</h1>
    <p class="overview__subtitle">Here's what's happening with your patients today.</p>
  </div>

  <div class="time-anchor">
    <!-- Date range select hidden until the data can actually be filtered by it. -->
    <span class="time-anchor__text" aria-live="polite">
      Updated <time [attr.datetime]="updatedAt().toISOString()">{{ updatedAt() | date: 'HH:mm' }}</time>
    </span>
    <button mat-icon-button type="button" class="time-anchor__refresh" aria-label="Refresh" (click)="refresh()">
      <mat-icon
        [class.time-anchor__refresh-icon--spinning]="refreshing()"
        (animationend)="refreshing.set(false)"
      >refresh</mat-icon>
    </button>
  </div>
</header>

<app-visit-banner class="overview__banner" [message]="sinceLastVisit()" actionLink="/clinician/audit-log" />

<section class="stats-grid" aria-label="Summary statistics">
  @for (stat of stats(); track stat.label) {
    <app-stats-card
      [label]="stat.label"
      [value]="stat.value"
      [delta]="stat.delta"
      [severity]="stat.severity"
      [icon]="stat.icon"
      [higherIsBetter]="stat.higherIsBetter"
      [pulse]="stat.pulse ?? false"
      link="/clinician/patients"
      [queryParams]="stat.filter ? { filter: stat.filter } : undefined"
      [linkLabel]="stat.linkLabel"
      [valueUnit]="stat.valueUnit"
    />
  }
</section>

<app-trend-chart
  class="trend-chart rise-in"
  [style.--rise-index]="stats().length"
  [heading]="submissionsTrend().heading"
  [points]="submissionsTrend().points"
>
  <mat-form-field trendChartControls appearance="outline" subscriptSizing="dynamic" class="trend-period">
    <mat-select aria-label="Chart period" [value]="trendPeriod()" (selectionChange)="trendPeriod.set($event.value)">
      @for (option of trendPeriodOptions; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</app-trend-chart>

<app-patient-list-table
  class="patient-list rise-in"
  [style.--rise-index]="stats().length + 1"
  heading="Recent Submissions"
  viewAllLink="/clinician/patients"
  [patients]="patients()"
  [staggerRows]="true"
/>
